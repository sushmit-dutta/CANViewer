[project]
name = "canviewer"
version = "0.2.0"
description = "Interactive CAN bus signal explorer: decode a log against a DBC and plot signals as discrete samples."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
dependencies = [
    "asammdf>=7.4.2,<8",
    "cantools>=38",
    "click>=8.0.0,<9",
    "dash>=3.2.0,<4",
    "pandas>=2.1.3,<3",
    "plotly>=5.18.0,<6",
    "python-can>=4.3",
]

[project.scripts]
canviewer = "canviewer.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["canviewer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
